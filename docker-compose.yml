# LITMUS local Docker demo — reproducible runs, no prod change.
# Supabase stays external (no DB container). Prod stays Vercel + Render.
# Usage:
#   1. backend/.env must exist (SUPABASE_URL, SUPABASE_SECRET_KEY=sb_secret_...,
#      OPENROUTER_API_KEY, FRONTEND_URL=http://localhost:3000).
#   2. Export frontend build args in your shell (publishable key ONLY):
#        $env:NEXT_PUBLIC_SUPABASE_URL="https://vetelmsgzntoebnfhmdj.supabase.co"
#        $env:NEXT_PUBLIC_SUPABASE_ANON_KEY="sb_publishable_..."
#      (PowerShell) or export ... (bash). Never sb_secret_* here.
#   3. docker compose up --build
#   4. Open http://localhost:3000/auth
# NOTE: NEXT_PUBLIC_* are baked at build — rebuild after any key change.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:3000
      PORT: 8000

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
